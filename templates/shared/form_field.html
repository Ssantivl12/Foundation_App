<div class="form-field form-field--{{ field.name }}{% if field.errors %} form-field--error{% endif %}">
    <label class="form-field__label" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %} *{% endif %}
    </label>
    <div class="form-field__control">
        {{ field }}
    </div>
    {% if field.help_text %}
        <small class="form-field__help">{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <ul class="form-field__errors">
            {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    {% endif %}
</div>
